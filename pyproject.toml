[build-system]
requires = ["setuptools>=68.0", "wheel"]
# setuptools' PEP 517 entry point. The previous value
# ("setuptools.backends._legacy:_Backend") is not a module setuptools has ever
# shipped, so every `pip install .` / `pip install -e .` failed with
# ModuleNotFoundError before pip could even read the metadata.
build-backend = "setuptools.build_meta"

[project]
name = "orchiday"
version = "0.1.0"
description = "Cross-platform no-code platform for hierarchical robot control"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Orchiday Team"}
]

# Runtime dependencies of the Orchiday app itself.
#
# NOTE: `torch` and `lerobot` are deliberately NOT listed. They live in a
# separate Python environment (the conda env Orchiday points at via
# python_path); the app only ever talks to them by spawning subprocesses, so
# pinning them here would force a multi-GB install on a machine that may only
# be used to drive a remote trainer.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    # Uvicorn ships NO WebSocket implementation of its own — bare `uvicorn`
    # requires only click and h11. Without one of `websockets` / `wsproto`
    # installed it answers the /ws upgrade with 404 ("No supported WebSocket
    # library detected") and every live channel in Orchiday goes dead: the
    # console dock stays empty, process start/stop never registers, and
    # recording, calibration and step-mark events never reach the UI. The page
    # still loads, so it looks like the app works. `websockets` (rather than
    # the uvicorn[standard] extra) keeps this to one pure-Python wheel that
    # installs on Linux, Windows and macOS alike.
    "websockets>=12.0",
    "pydantic>=2.0",
    "httpx>=0.26",
    "PySide6>=6.6",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pyserial>=3.5",
    "certifi>=2024.2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
orchiday = "orchiday.server:main"


[tool.setuptools.packages.find]
where = ["src"]
