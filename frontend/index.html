<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Orchiday OS — Cross-platform platform for hierarchical robot control with LeRobot and LLM/VLM orchestration.">
  <title>Orchiday OS — Robot Control Workbench</title>
  <!-- Without this the browser asks for /favicon.ico, which the server does not
       serve, and every single page load ends with a 404 in the console. -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>
  <!-- The whole UI is rendered by src/App.tsx. Nothing is written here by
       hand: the built index.html is a generated file (see vite.config.ts),
       and markup added here would be silently overwritten on the next build. -->
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
